[package]
name = "speakrs-diar"
version = "0.1.0"
edition = "2024"
# speakrs 0.7 needs 1.96.
rust-version = "1.96"
description = "Sidecar binary that runs speakrs diarization and emits JSON for the Python pipeline"

[[bin]]
name = "speakrs-diar"
path = "src/main.rs"

[dependencies]
# Without speakrs' `online` feature: it downloads over native-tls, which links the
# system OpenSSL on Linux, so a wheel built on one distribution fails to load on
# another. main.rs downloads the same files with hf-hub over rustls instead, the
# way upstream's own Python wheels do.
speakrs = { version = "0.7", default-features = false }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
hound = "3.5"
# The version speakrs uses, so its result arrays are these types.
ndarray = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Each backend is a speakrs feature. `cpu` is native Rust with no runtime
# dependency and works everywhere; the wheels add the platform's accelerator:
#   macOS arm64:   cpu + coreml
#   Linux x86_64:  cpu + cuda  (driver, cuDNN and cuBLAS load at run time; the
#                               build needs no CUDA toolkit)
#   Windows x64:   cpu         (speakrs has no Windows GPU backend)
[features]
default = ["cpu"]
cpu = ["speakrs/cpu"]
coreml = ["speakrs/coreml"]
cuda = ["speakrs/cuda"]

[profile.release]
opt-level = 3
