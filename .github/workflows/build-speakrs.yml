name: Build speakrs-diar wheels

# The diarization sidecar, one wheel per platform. Called by ci.yml on every push
# and by publish.yml on a release tag, so a release ships exactly what CI built
# and checked.
on:
  workflow_call:

jobs:
  wheel:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each wheel is `cpu` (the crate default) plus the platform's accelerator.
          # Keep in step with the dependency marker in the root pyproject.toml.
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            features: coreml
            smoke-modes: cpu coreml
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Loads the driver, cuDNN and cuBLAS at run time; builds without a CUDA
            # toolkit, and a machine without NVIDIA still gets the cpu mode.
            features: cuda
            smoke-modes: cpu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            smoke-modes: cpu
            # Link the C runtime into the binary. Without this it needs
            # vcruntime140.dll, which a fresh Windows install does not have.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: dtolnay/rust-toolchain@stable

      - name: Unit tests
        working-directory: packages/speakrs-diar
        shell: bash
        run: cargo test --release --features "cpu ${{ matrix.features }}"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/speakrs-diar
          target: ${{ matrix.target }}
          # Linux only (ignored elsewhere): builds inside the manylinux_2_28
          # container, so the binary runs on any glibc 2.28+ distribution.
          manylinux: "2_28"
          maturin-version: v1.16.0
          rust-toolchain: stable
          args: --release --out dist ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Fail unless the wheel is self-contained
        shell: bash
        run: uv run --no-project --with 'lief==1.0.0' python scripts/check-speakrs-wheel.py packages/speakrs-diar/dist/*.whl

      # Installs the wheel the way a user gets it, then checks that paraspeakrs
      # finds the binary and that it downloads its models and diarizes a file.
      - name: Smoke test
        shell: bash
        run: |
          uv venv --python 3.12 smoke
          uv pip install --python smoke . packages/speakrs-diar/dist/*.whl
          python=smoke/bin/python
          [ -e "$python" ] || python=smoke/Scripts/python.exe
          "$python" scripts/smoke-test-speakrs.py ${{ matrix.smoke-modes }}

      - uses: actions/upload-artifact@v4
        with:
          name: speakrs-wheel-${{ matrix.name }}
          path: packages/speakrs-diar/dist/*.whl
