# Ships the speakrs-diar sidecar as a platform wheel so `uv tool install paraspeakrs`
# needs no cargo, no Rust toolchain and no Homebrew. maturin's `bindings = "bin"` mode
# installs the compiled binary next to the interpreter, which is the first place
# paraspeakrs.config.default_speakrs_bin() looks.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "paraspeakrs-speakrs"
version = "0.10.0"
description = "Native sidecars for paraspeakrs: speakrs diarization, and meeting recording on Linux and Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Albert Groothedde", email = "516972+alber70g@users.noreply.github.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/alber70g/paraspeakrs"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
# No features here: the crate's default is `cpu`, which builds anywhere, and each
# release wheel adds its platform's accelerator on the command line (publish.yml):
# `coreml` on macOS, which is not optional there because default_speakrs_mode()
# returns "coreml" on darwin, and `cuda` on Linux x86_64.
