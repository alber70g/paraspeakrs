name: Publish to PyPI

# Two distributions ship from this repo:
#   paraspeakrs          - pure Python, one wheel for every platform
#   paraspeakrs-speakrs  - the Rust diarization sidecar: macOS arm64, Linux x86_64
#                          and Windows x64 wheels (build-speakrs.yml)
# paraspeakrs depends on paraspeakrs-speakrs, so the sidecar reaches PyPI first and
# a fresh install of the new paraspeakrs resolves to the matching sidecar.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
      # Tests mock the sidecar. Skipping it also keeps this job installable while
      # the lockfile still names a sidecar release without a Linux wheel.
      - run: uv sync --group dev --no-install-package paraspeakrs-speakrs
      - run: uv run --no-sync pytest -q

  build-speakrs:
    uses: ./.github/workflows/build-speakrs.yml

  publish-speakrs:
    needs: [test, build-speakrs]
    runs-on: ubuntu-latest
    # A distinct environment from the one the main package uses, not decoration:
    # PyPI keys a pending trusted publisher on (owner, repo, workflow, environment)
    # and refuses to register the same combination for a second project name.
    environment: pypi-speakrs
    permissions:
      # A job-level permissions block REPLACES the defaults rather than adding to
      # them, so id-token alone leaves the job without contents: read -- and
      # actions/checkout then fails a private repo with "Repository not found".
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/download-artifact@v4
        with:
          pattern: speakrs-wheel-*
          merge-multiple: true
          path: dist
      - name: Check the tag matches the sidecar version
        run: |
          VERSION=$(uv version --short --project packages/speakrs-diar)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME does not match paraspeakrs-speakrs $VERSION" >&2
            exit 1
          }
      - run: uv publish --trusted-publishing always dist/*.whl

  publish:
    needs: publish-speakrs
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A job-level permissions block REPLACES the defaults rather than adding to
      # them, so id-token alone leaves the job without contents: read -- and
      # actions/checkout then fails a private repo with "Repository not found".
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Check the tag matches the package version
        run: |
          VERSION=$(uv version --short)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $VERSION" >&2
            exit 1
          }
      - run: uv build
      - run: uv publish --trusted-publishing always
