name: CI

# The Python tests on all three platforms the sidecar ships for, and the sidecar
# wheels themselves. Tags are left to publish.yml, which runs the same build.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
      # Tests mock the sidecar. Skipping it also keeps Linux and Windows installable
      # while the lockfile still names a sidecar release with only a macOS wheel.
      - run: uv sync --group dev --no-install-package paraspeakrs-speakrs
      - run: uv run --no-sync pytest -q

  speakrs:
    uses: ./.github/workflows/build-speakrs.yml
